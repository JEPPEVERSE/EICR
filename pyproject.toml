[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eicr-memory"
version = "0.3.0"
description = "Evidence-induced tag routing and bounded graph-memory retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/JEPPEVERSE/EICR"

[project.optional-dependencies]
test = ["pytest>=7", "build>=1"]
tokens = ["tiktoken>=0.7"]
pilot = ["tokenizers==0.22.2"]

[project.scripts]
eicr = "eicr.cli:main"
eitr = "eitr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
